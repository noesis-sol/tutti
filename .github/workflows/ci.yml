# Runs the check (scripts/check.sh, § 13) with its slow suites, scripts/check-full.sh, on Linux and
# macOS for each push to main and each pull request, and builds the runner's own binary with
# scripts/build.sh and runs it, so a change that breaks the compiled build fails here rather than in
# a release (release.yml). A release commit pushed alone (scripts/release-commit.sh) is left to
# release.yml's check at its tag, rather than checked twice: it changes only CHANGELOG.md and
# package.json's version, and its parent was checked here when it was pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its running check; main's pushes are each checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The Bun tutti is developed and released with; release.yml pins the same.
env:
  BUN_VERSION: 1.4.3

jobs:
  # Whether this push is a release commit alone, which the other jobs leave to release.yml. Not
  # `[skip ci]` in its message: GitHub skips the tag's push for it too, and nothing is released.
  release-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      alone: ${{ steps.commit.outputs.alone }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the commit's parent, which the script compares with the push's before

      - id: commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && scripts/release-commit.sh "$BEFORE"; then
            echo "alone=true" >> "$GITHUB_OUTPUT"
          else
            echo "alone=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: release-commit
    if: needs.release-commit.outputs.alone != 'true'
    strategy:
      fail-fast: false # a failure on one system says nothing about the other
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # The tests on every core of the runner, which runs nothing else, rather than the half
      # scripts/test.sh keeps to on a shared machine (testWorkers): macos-latest's 3 cores ran them in
      # one process.
      - name: Use every core
        run: echo "TUTTI_TEST_PARALLEL=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

      - name: Check
        run: scripts/check-full.sh

  # The host's build, as a release builds it (§ 12 Builds), less --release: its --version carries
  # the commit.
  build:
    needs: release-commit
    if: needs.release-commit.outputs.alone != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: scripts/build.sh --out dist host

      - name: Run
        run: |
          version="$(dist/*/tutti --version)"
          echo "$version"
          want="tutti v$(bun --print 'require("./package.json").version') $(git rev-parse HEAD | cut -c 1-12)"
          [ "$version" = "$want" ] || { echo "::error::tutti --version printed '$version', not '$want'"; exit 1; }
